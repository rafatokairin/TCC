[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "breastsynth"
version = "1.0.0"
description = "Leakage-free synthetic data augmentation for breast cancer mammography classification"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Academic use only" }
authors = [{ name = "Rafael Palheta Tokairin" }]
dependencies = [
    "torch>=2.1",
    "torchvision>=0.16",
    "lpips>=0.1.4",
    "numpy>=1.24",
    "pandas>=2.0",
    "pillow>=10.0",
    "scikit-learn>=1.3",
    "scipy>=1.11",
    "tqdm>=4.66",
    "imagehash>=4.3",
    "pyyaml>=6.0",
    "matplotlib>=3.7",
    "torchmetrics>=1.2",
    "torch-fidelity>=0.3.0",
    "kagglehub>=0.3",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "ruff>=0.1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
